server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; media-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

  location /api/ {
    # A literal hostname in proxy_pass is resolved once, at config load, so nginx
    # kept dialling the previous api container's IP after any recreation and every
    # call became a 502. Docker's embedded DNS plus a variable re-resolves per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /media/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }
  location / { try_files $uri /index.html; }
}
