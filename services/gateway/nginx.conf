limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=200r/s;

# Docker's embedded DNS answers a *different* address every time a service is recreated, and a hostname
# written into an `upstream` block is resolved once, at config load. Measured: after step 8's restore
# rebuilt the application tier, every route this gateway proxies answered 502, because its peer table
# still held the api's previous container address -- an address the pool had meanwhile handed to the
# worker, so the gateway was dialling a different service. Nothing in the stack reported it: the
# gateway's own healthcheck asks a local path, so it stayed `healthy` while every real request failed.
# `resolve` makes nginx track the name; in open-source nginx it needs a `resolver` and a shared-memory
# `zone` per upstream, and it is open-source since 1.27.3 (this image reports 1.27.5). Same defect,
# same fix, already carried by the web container's own proxy: services/web/nginx.conf:12-18.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream { zone api_upstream 64k; server api:8000 resolve; keepalive 128; }
upstream web_upstream { zone web_upstream 64k; server web:80 resolve; keepalive 16; }
upstream admin_upstream { zone admin_upstream 64k; server admin:80 resolve; keepalive 16; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 55m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  location = /gateway-health { return 200 'ok'; add_header Content-Type text/plain; }

  location /api/ {
    limit_req zone=api_per_ip burst=600 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append. $proxy_add_x_forwarded_for keeps whatever the caller sent at the head
    # of the chain, and the api trusts the chain because this container is on its allow-list -- so an
    # appended header would let a client choose the address the login gates key on. $remote_addr is
    # the peer of *this* connection, which is the one address on this host nobody can forge.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  location /media/ {
    limit_req zone=api_per_ip burst=400 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append. $proxy_add_x_forwarded_for keeps whatever the caller sent at the head
    # of the chain, and the api trusts the chain because this container is on its allow-list -- so an
    # appended header would let a client choose the address the login gates key on. $remote_addr is
    # the peer of *this* connection, which is the one address on this host nobody can forge.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location = /docs { proxy_pass http://api_upstream/docs; }
  location = /openapi.json { proxy_pass http://api_upstream/openapi.json; }
  location = /health { proxy_pass http://api_upstream/health; }
  location = /ready { proxy_pass http://api_upstream/ready; }

  location /admin/ {
    proxy_pass http://admin_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /admin;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
