apiVersion: v1
kind: Namespace
metadata: {name: resonance}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: resonance-config, namespace: resonance}
data:
  MUSIC_PROVIDER: generic_rest
  PROVIDER_APPROVAL_STATUS: approved_commercial
  COOKIE_SECURE: "true"
  CORS_ORIGINS: https://music.example.com
  S3_BUCKET: music-assets
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: resonance}
spec:
  replicas: 2
  selector: {matchLabels: {app: resonance-api}}
  template:
    metadata: {labels: {app: resonance-api}}
    spec:
      containers:
        - name: api
          image: registry.example.com/resonance/api:13.0.0-cost500
          envFrom:
            - configMapRef: {name: resonance-config}
            - secretRef: {name: resonance-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: resonance}
spec:
  selector: {app: resonance-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: resonance}
spec:
  replicas: 2
  selector: {matchLabels: {app: resonance-worker}}
  template:
    metadata: {labels: {app: resonance-worker}}
    spec:
      containers:
        - name: worker
          image: registry.example.com/resonance/worker:13.0.0-cost500
          envFrom:
            - configMapRef: {name: resonance-config}
            - secretRef: {name: resonance-secrets}
          ports: [{containerPort: 9101}]
          readinessProbe: {httpGet: {path: /health, port: 9101}, initialDelaySeconds: 10, periodSeconds: 5}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: resonance}
spec:
  replicas: 2
  selector: {matchLabels: {app: resonance-web}}
  template:
    metadata: {labels: {app: resonance-web}}
    spec:
      containers:
        - {name: web, image: registry.example.com/resonance/web:13.0.0-cost500, ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: resonance}
spec: {selector: {app: resonance-web}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin, namespace: resonance}
spec:
  replicas: 2
  selector: {matchLabels: {app: resonance-admin}}
  template:
    metadata: {labels: {app: resonance-admin}}
    spec:
      containers:
        - {name: admin, image: registry.example.com/resonance/admin:13.0.0-cost500, ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: admin, namespace: resonance}
spec: {selector: {app: resonance-admin}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: resonance}
spec:
  replicas: 2
  selector: {matchLabels: {app: resonance-gateway}}
  template:
    metadata: {labels: {app: resonance-gateway}}
    spec:
      containers:
        - name: gateway
          image: registry.example.com/resonance/gateway:13.0.0-cost500
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /gateway-health, port: 80}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: resonance}
spec:
  type: ClusterIP
  selector: {app: resonance-gateway}
  ports: [{port: 80, targetPort: 80}]
