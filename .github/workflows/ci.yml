name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r services/api/requirements.txt -r services/worker/requirements.txt -r services/payment-emulator/requirements.txt -r services/acceptance/requirements.txt -r scripts/requirements-drill.txt pytest pyyaml jsonschema
      - run: ./scripts/static-verify.sh
      - name: Validate compose config (with diagnostics)
        shell: bash
        run: |
          cp .env.example .env
          set -o pipefail
          docker compose config 2>&1 | tee /tmp/cfg.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then tail -40 /tmp/cfg.log | sed 's/^/::error::/'; exit "$rc"; fi
      - name: Validate commercial override
        shell: bash
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml config 2>&1 | tee /tmp/cfg2.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then tail -40 /tmp/cfg2.log | sed 's/^/::error::/'; exit "$rc"; fi
      - run: ./scripts/release-evidence.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/*.tar.gz
          if-no-files-found: ignore

  compose-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # The drills run on the runner, not in a container: httpx for the transport, and the
      # test-side decoder that proves the enrolment QR is the URI the API claims (see
      # scripts/requirements-drill.txt).
      - run: pip install httpx -r scripts/requirements-drill.txt
      - run: cp .env.example .env
      - name: Start stack (with diagnostics)
        shell: bash
        run: |
          if ! docker compose up --build -d > /tmp/up.log 2>&1; then
            echo "::error title=compose-up::$(tail -50 /tmp/up.log | tr -d '\r' | tr '\n' ' ' | head -c 2500)"
            echo "::error title=api-logs::$(docker compose logs --no-color api 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            echo "::error title=worker-logs::$(docker compose logs --no-color worker 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - run: docker compose ps
      - name: Run acceptance (with diagnostics)
        shell: bash
        run: |
          if ! docker compose --profile test run --rm acceptance > /tmp/acc.log 2>&1; then
            echo "::error title=acceptance::$(tail -60 /tmp/acc.log | tr -d '\r' | tr '\n' ' ' | head -c 3500)"
            echo "::error title=api-logs::$(docker compose logs --no-color api 2>/dev/null | tail -50 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - name: Run contract tests (with diagnostics)
        shell: bash
        run: |
          if ! ./scripts/contract-test.sh > /tmp/contract.log 2>&1; then
            echo "::error title=contract-test::$(tail -70 /tmp/contract.log | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - run: ./scripts/chaos-worker-recovery.sh
      - name: Two-worker lease contention
        shell: bash
        run: |
          if ! ./scripts/lease-contention.sh > /tmp/contention.log 2>&1; then
            echo "::error title=lease-contention::$(tail -25 /tmp/contention.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            exit 1
          fi
          cat /tmp/contention.log
      - name: Absolute fingerprint of what is about to be backed up
        run: python scripts/restore_fidelity.py snapshot
      - run: ./scripts/backup.sh ci
      - name: Restore from backup (with diagnostics)
        shell: bash
        run: |
          if ! RESTORE_CONFIRM=YES ./scripts/restore.sh backups/ci > /tmp/restore.log 2>&1; then
            echo "::error title=restore::$(tail -25 /tmp/restore.log | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - name: Restore did not change a byte of the media or the ledger
        run: python scripts/restore_fidelity.py compare
      - run: docker compose --profile test run --rm acceptance
      - name: Gateway follows the api across a recreate
        shell: bash
        run: |
          # Why this step sits here rather than three steps later: acceptance-20260928T054641Z turned red in
          # the second-factor drill, and the cause was the restore just above -- restore.sh recreates the
          # application tier, the recreated api gets a different address from Docker's IPAM, and an
          # `upstream { server api:8000; }` resolves that name once, at config load. Every request through
          # the gateway then dialled the previous container's address (which the pool had handed to the
          # worker) and got 502, while the gateway's own healthcheck kept reporting healthy because it asks a
          # local path. Ask the gateway, right after the thing that moves the address, and ask it again after
          # deliberately moving it once more.
          port="$(docker compose port gateway 80 | cut -d: -f2)"
          test -n "$port" || { echo "::error title=gateway-port::compose reported no published port for gateway:80"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${port}/health")"
          if [ "$code" != "200" ]; then
            echo "::error title=gateway-after-restore::/health through the gateway (127.0.0.1:${port}) is $code, not 200, right after the restore"
            docker compose logs --no-color gateway | tail -20 | tr -d '\r'
            exit 1
          fi
          before="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q api)")"
          net="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q web)")"
          # The IPAM hands a recreated container the lowest free address, and in a stopped-then-started
          # single-service case that is usually the one it just gave up -- so the "did the proxy keep up"
          # question would go unasked. Occupy that address first and the recreated api has to move.
          docker compose stop api
          docker run -d --network "$net" --ip "$before" --name gw-staleness-steal alpine:3 sleep 300 >/dev/null
          docker compose up -d --force-recreate api > /tmp/recreate.log 2>&1 || { tail -20 /tmp/recreate.log; exit 1; }
          for _ in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo starting)" = "healthy" ] && break
            sleep 2
          done
          after="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q api)")"
          docker rm -f gw-staleness-steal >/dev/null 2>&1
          if [ "$before" = "$after" ]; then
            echo "::warning title=gateway-arm-vacuous::the api came back on ${after}; the re-resolution leg proved nothing this run"
          fi
          # The resolver caches for valid=10s, so a green immediately after the recreate would prove nothing;
          # idle past the window and let the first request be the one that has to re-resolve.
          sleep 14
          code2="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${port}/health")"
          if [ "$code2" != "200" ]; then
            echo "::error title=gateway-stale-upstream::/health through the gateway is $code2 after the api moved ${before} -> ${after}: the proxy is dialling the old container address"
            docker compose logs --no-color gateway | tail -20 | tr -d '\r'
            exit 1
          fi
          echo "gateway proxied /health (200) after the restore and after the api moved ${before} -> ${after}"
      - name: Subject access export and erasure drill
        shell: bash
        run: |
          if ! python scripts/erasure_drill.py > /tmp/erasure.log 2>&1; then
            echo "::error title=erasure-drill::$(grep -E '^  - |FAIL|failed' /tmp/erasure.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            tail -40 /tmp/erasure.log
            exit 1
          fi
          tail -5 /tmp/erasure.log
      - name: Second factor lifecycle drill
        shell: bash
        run: |
          if ! python scripts/mfa_drill.py > /tmp/mfa.log 2>&1; then
            echo "::error title=mfa-drill::$(grep -E '^  - |FAIL|failed' /tmp/mfa.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            tail -40 /tmp/mfa.log
            exit 1
          fi
          tail -5 /tmp/mfa.log
      - name: Workspace membership and role drill
        shell: bash
        run: |
          if ! python scripts/member_drill.py > /tmp/member.log 2>&1; then
            echo "::error title=member-drill::$(grep -E '^  - |FAIL|failed' /tmp/member.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            tail -40 /tmp/member.log
            exit 1
          fi
          tail -5 /tmp/member.log
      - name: Media scan boundary drill
        shell: bash
        run: |
          if ! python scripts/media_scan_drill.py > /tmp/scan.log 2>&1; then
            echo "::error title=media-scan-drill::$(grep -E '^  - |FAIL|failed' /tmp/scan.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            tail -40 /tmp/scan.log
            exit 1
          fi
          tail -5 /tmp/scan.log
      - name: Public rights intake drill
        shell: bash
        run: |
          if ! python scripts/report_drill.py > /tmp/report.log 2>&1; then
            echo "::error title=report-drill::$(grep -E '^  - |FAIL|failed' /tmp/report.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            tail -40 /tmp/report.log
            exit 1
          fi
          tail -5 /tmp/report.log
      - name: Third-party provider adapter round trip
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f docker-compose.generic-rest.yml up --build -d
          if ! python scripts/provider_regression.py 25 4 generic_rest > /tmp/genrest.log 2>&1; then
            echo "::error title=generic-rest::$(grep -E '^  FAIL|expected provider' /tmp/genrest.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            tail -40 /tmp/genrest.log
            exit 1
          fi
          tail -3 /tmp/genrest.log
      - if: always()
        run: docker compose logs --no-color > compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: compose-logs, path: compose.log}
      - if: always()
        run: docker compose down -v --remove-orphans

  commercial-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx
      - run: cp .env.example .env
      - name: Start commercial stack (with diagnostics)
        shell: bash
        run: |
          if ! docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml up --build -d > /tmp/up-comm.log 2>&1; then
            echo "::error title=compose-up::$(tail -50 /tmp/up-comm.log | tr -d '\r' | tr '\n' ' ' | head -c 2500)"
            echo "::error title=api-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color api 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            echo "::error title=worker-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color worker 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - name: 100-run generation regression
        shell: bash
        run: |
          if ! python scripts/provider_regression.py "${REGRESSION_JOBS:-100}" 8 > /tmp/reg.log 2>&1; then
            echo "::error title=provider-regression::$(tail -20 /tmp/reg.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            exit 1
          fi
          cat /tmp/reg.log
      - name: Market reconciliation (with diagnostics)
        shell: bash
        run: |
          if ! python scripts/reconcile_market.py > /tmp/reconcile.log 2>&1; then
            echo "::error title=market-reconciliation::$(tail -25 /tmp/reconcile.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            exit 1
          fi
          cat /tmp/reconcile.log
      - name: Exclusive-offer reservation race (with diagnostics)
        shell: bash
        run: |
          if ! python scripts/reservation_race.py > /tmp/race.log 2>&1; then
            echo "::error title=reservation-race::$(tail -25 /tmp/race.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color api 2>/dev/null | tail -30 | sed 's/^/::error title=api::/' || true
            exit 1
          fi
          cat /tmp/race.log
      - name: Run commercial acceptance (with diagnostics)
        shell: bash
        run: |
          if ! docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml --profile commercial-test run --rm acceptance-commercial > /tmp/acc-comm.log 2>&1; then
            echo "::error title=acceptance-commercial::$(grep -E '^E |FAILED|AssertionError|Error' /tmp/acc-comm.log | tr -d '\r' | tr '\n' ' ' | head -c 4500)"
            echo "::error title=api-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color api 2>/dev/null | grep -vE 'GET /ready|GET /metrics|GET /api/orders|GET /api/jobs/' | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            echo "::error title=worker-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color worker 2>/dev/null | tail -50 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - name: Legal hold drill (with diagnostics)
        shell: bash
        run: |
          if ! python scripts/hold_drill.py > /tmp/hold.log 2>&1; then
            echo "::error title=hold-drill::$(tail -25 /tmp/hold.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color api 2>/dev/null | tail -30 | sed 's/^/::error title=api::/' || true
            exit 1
          fi
          cat /tmp/hold.log
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color > commercial-compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: commercial-compose-logs, path: commercial-compose.log}
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml down -v --remove-orphans

  browser-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: cp .env.example .env
      - name: Start stack (with diagnostics)
        shell: bash
        run: |
          if ! docker compose up --build -d > /tmp/up-a11y.log 2>&1; then
            echo "::error title=compose-up::$(tail -50 /tmp/up-a11y.log | tr -d '\r' | tr '\n' ' ' | head -c 2500)"
            exit 1
          fi
      - name: Audit must be able to fail
        run: python scripts/browser_a11y.py --self-test
      - name: Real-browser walkthrough and axe audit (with diagnostics)
        shell: bash
        run: |
          if ! python scripts/browser_a11y.py > /tmp/a11y.log 2>&1; then
            echo "::error title=browser-a11y::$(grep -E '^  - |^FAIL' /tmp/a11y.log | tr -d '\r' | tr '\n' ' ' | head -c 3500)"
            tail -40 /tmp/a11y.log
            exit 1
          fi
          cat /tmp/a11y.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: browser-a11y-report, path: release-evidence/browser-a11y-*/report.json, if-no-files-found: ignore}
      - if: always()
        run: docker compose down -v --remove-orphans

  capacity-500:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements.txt -r services/worker/requirements.txt -r services/payment-emulator/requirements.txt -r services/acceptance/requirements.txt -r scripts/requirements-drill.txt pytest pyyaml jsonschema httpx
      - run: cp .env.example .env
      - name: Run the 500-user capacity gate (with diagnostics)
        shell: bash
        run: |
          if ! ./scripts/capacity-gate-500.sh > /tmp/capacity.log 2>&1; then
            echo "::error title=capacity-gate::$(tail -30 /tmp/capacity.log | tr -d '\r' | tr '\n' ' ' | head -c 3500)"
            tail -40 /tmp/capacity.log
            exit 1
          fi
          tail -15 /tmp/capacity.log
      - if: always()
        run: docker compose logs --no-color > capacity-compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: capacity-500-logs, path: capacity-compose.log}
      - if: always()
        run: docker compose down -v --remove-orphans
