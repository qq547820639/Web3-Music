name: v12-final-product
on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r services/api/requirements.txt -r services/payment-emulator/requirements.txt pytest pyyaml jsonschema
      - run: ./scripts/static-verify.sh
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml config --quiet

  compose-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: docker compose ps
      - run: docker compose --profile test run --rm acceptance
      - run: ./scripts/contract-test.sh
      - run: ./scripts/chaos-worker-recovery.sh
      - run: ./scripts/backup.sh ci
      - run: RESTORE_CONFIRM=YES ./scripts/restore.sh backups/ci
      - run: docker compose --profile test run --rm acceptance
      - if: always()
        run: docker compose logs --no-color > compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: compose-logs, path: compose.log}
      - if: always()
        run: docker compose down -v --remove-orphans

  commercial-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml up --build -d
      - run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml --profile commercial-test run --rm acceptance-commercial
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color > commercial-compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: commercial-compose-logs, path: commercial-compose.log}
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml down -v --remove-orphans
