name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r services/api/requirements.txt -r services/worker/requirements.txt -r services/payment-emulator/requirements.txt -r services/acceptance/requirements.txt pytest pyyaml jsonschema
      - run: ./scripts/static-verify.sh
      - name: Validate compose config (with diagnostics)
        shell: bash
        run: |
          cp .env.example .env
          set -o pipefail
          docker compose config 2>&1 | tee /tmp/cfg.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then tail -40 /tmp/cfg.log | sed 's/^/::error::/'; exit "$rc"; fi
      - name: Validate commercial override
        shell: bash
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml config 2>&1 | tee /tmp/cfg2.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then tail -40 /tmp/cfg2.log | sed 's/^/::error::/'; exit "$rc"; fi
      - run: ./scripts/release-evidence.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/*.tar.gz
          if-no-files-found: ignore

  compose-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx
      - run: cp .env.example .env
      - name: Start stack (with diagnostics)
        shell: bash
        run: |
          if ! docker compose up --build -d > /tmp/up.log 2>&1; then
            echo "::error title=compose-up::$(tail -50 /tmp/up.log | tr -d '\r' | tr '\n' ' ' | head -c 2500)"
            echo "::error title=api-logs::$(docker compose logs --no-color api 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            echo "::error title=worker-logs::$(docker compose logs --no-color worker 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - run: docker compose ps
      - name: Run acceptance (with diagnostics)
        shell: bash
        run: |
          if ! docker compose --profile test run --rm acceptance > /tmp/acc.log 2>&1; then
            echo "::error title=acceptance::$(tail -60 /tmp/acc.log | tr -d '\r' | tr '\n' ' ' | head -c 3500)"
            echo "::error title=api-logs::$(docker compose logs --no-color api 2>/dev/null | tail -50 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - name: Run contract tests (with diagnostics)
        shell: bash
        run: |
          if ! ./scripts/contract-test.sh > /tmp/contract.log 2>&1; then
            echo "::error title=contract-test::$(tail -70 /tmp/contract.log | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - run: ./scripts/chaos-worker-recovery.sh
      - name: Two-worker lease contention
        shell: bash
        run: |
          if ! ./scripts/lease-contention.sh > /tmp/contention.log 2>&1; then
            echo "::error title=lease-contention::$(tail -25 /tmp/contention.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            exit 1
          fi
          cat /tmp/contention.log
      - run: ./scripts/backup.sh ci
      - name: Restore from backup (with diagnostics)
        shell: bash
        run: |
          if ! RESTORE_CONFIRM=YES ./scripts/restore.sh backups/ci > /tmp/restore.log 2>&1; then
            echo "::error title=restore::$(tail -25 /tmp/restore.log | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - run: docker compose --profile test run --rm acceptance
      - if: always()
        run: docker compose logs --no-color > compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: compose-logs, path: compose.log}
      - if: always()
        run: docker compose down -v --remove-orphans

  commercial-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx
      - run: cp .env.example .env
      - name: Start commercial stack (with diagnostics)
        shell: bash
        run: |
          if ! docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml up --build -d > /tmp/up-comm.log 2>&1; then
            echo "::error title=compose-up::$(tail -50 /tmp/up-comm.log | tr -d '\r' | tr '\n' ' ' | head -c 2500)"
            echo "::error title=api-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color api 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            echo "::error title=worker-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color worker 2>/dev/null | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - name: 100-run generation regression
        shell: bash
        run: |
          if ! python scripts/provider_regression.py "${REGRESSION_JOBS:-100}" 8 > /tmp/reg.log 2>&1; then
            echo "::error title=provider-regression::$(tail -20 /tmp/reg.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            exit 1
          fi
          cat /tmp/reg.log
      - name: Market reconciliation (with diagnostics)
        shell: bash
        run: |
          if ! python scripts/reconcile_market.py > /tmp/reconcile.log 2>&1; then
            echo "::error title=market-reconciliation::$(tail -25 /tmp/reconcile.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            exit 1
          fi
          cat /tmp/reconcile.log
      - name: Exclusive-offer reservation race (with diagnostics)
        shell: bash
        run: |
          if ! python scripts/reservation_race.py > /tmp/race.log 2>&1; then
            echo "::error title=reservation-race::$(tail -25 /tmp/race.log | tr -d '\r' | tr '\n' ' ' | head -c 3000)"
            docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color api 2>/dev/null | tail -30 | sed 's/^/::error title=api::/' || true
            exit 1
          fi
          cat /tmp/race.log
      - name: Run commercial acceptance (with diagnostics)
        shell: bash
        run: |
          if ! docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml --profile commercial-test run --rm acceptance-commercial > /tmp/acc-comm.log 2>&1; then
            echo "::error title=acceptance-commercial::$(grep -E '^E |FAILED|AssertionError|Error' /tmp/acc-comm.log | tr -d '\r' | tr '\n' ' ' | head -c 4500)"
            echo "::error title=api-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color api 2>/dev/null | grep -vE 'GET /ready|GET /metrics|GET /api/orders|GET /api/jobs/' | tail -40 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            echo "::error title=worker-logs::$(docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color worker 2>/dev/null | tail -50 | tr -d '\r' | tr '\n' ' ' | head -c 4000)"
            exit 1
          fi
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml logs --no-color > commercial-compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: commercial-compose-logs, path: commercial-compose.log}
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.commercial-test.yml down -v --remove-orphans

  browser-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: cp .env.example .env
      - name: Start stack (with diagnostics)
        shell: bash
        run: |
          if ! docker compose up --build -d > /tmp/up-a11y.log 2>&1; then
            echo "::error title=compose-up::$(tail -50 /tmp/up-a11y.log | tr -d '\r' | tr '\n' ' ' | head -c 2500)"
            exit 1
          fi
      - name: Audit must be able to fail
        run: python scripts/browser_a11y.py --self-test
      - name: Real-browser walkthrough and axe audit (with diagnostics)
        shell: bash
        run: |
          if ! python scripts/browser_a11y.py > /tmp/a11y.log 2>&1; then
            echo "::error title=browser-a11y::$(grep -E '^  - |^FAIL' /tmp/a11y.log | tr -d '\r' | tr '\n' ' ' | head -c 3500)"
            tail -40 /tmp/a11y.log
            exit 1
          fi
          cat /tmp/a11y.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: browser-a11y-report, path: release-evidence/browser-a11y-*/report.json, if-no-files-found: ignore}
      - if: always()
        run: docker compose down -v --remove-orphans

  capacity-500:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements.txt -r services/worker/requirements.txt -r services/payment-emulator/requirements.txt -r services/acceptance/requirements.txt pytest pyyaml jsonschema httpx
      - run: cp .env.example .env
      - name: Run the 500-user capacity gate (with diagnostics)
        shell: bash
        run: |
          if ! ./scripts/capacity-gate-500.sh > /tmp/capacity.log 2>&1; then
            echo "::error title=capacity-gate::$(tail -30 /tmp/capacity.log | tr -d '\r' | tr '\n' ' ' | head -c 3500)"
            tail -40 /tmp/capacity.log
            exit 1
          fi
          tail -15 /tmp/capacity.log
      - if: always()
        run: docker compose logs --no-color > capacity-compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: capacity-500-logs, path: capacity-compose.log}
      - if: always()
        run: docker compose down -v --remove-orphans
