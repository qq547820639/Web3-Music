services:
  api:
    environment:
      MUSIC_PROVIDER: synthetic_licensed
      PROVIDER_APPROVAL_STATUS: approved_commercial
  worker:
    environment:
      MUSIC_PROVIDER: synthetic_licensed
      PROVIDER_APPROVAL_STATUS: approved_commercial
  acceptance-commercial:
    profiles: ["commercial-test"]
    build: ./services/acceptance
    # The tenant-isolation suite needs an approved commercial provider capability to reach
    # offers/licenses/deliveries/payouts, which the default stack deliberately blocks
    # (its emulator snapshot is commercial_rights: blocked), so it runs alongside here.
    command: ["pytest", "-q", "-s", "test_commercial.py", "test_tenant_isolation.py"]
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ./services/acceptance:/tests:ro
    working_dir: /tests
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
