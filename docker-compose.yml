name: ai-music-platform-v13

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: music
      POSTGRES_USER: music_admin
      POSTGRES_PASSWORD: music_admin
    ports: ["54329:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_admin -d music"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["63799:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 4s
      timeout: 3s
      retries: 30

  migrate:
    build: ./services/migrate
    environment:
      DATABASE_URL: postgresql://music_admin:music_admin@postgres:5432/music
      MIGRATIONS_DIR: /migrations
    volumes: ["./db/migrations:/migrations:ro"]
    depends_on:
      postgres: {condition: service_healthy}

  provider-emulator:
    build: ./services/provider-emulator
    environment:
      PORT: 8010
      MEDIA_ROOT: /data/provider-media
      SQLITE_PATH: /data/provider/provider.db
      # No webhook secret here. This emulator declares supports_webhooks:false and never pushes an
      # event, so the variable that used to sit on this line was read by nothing -- it only made the
      # provider secret look like it was wired into the provider. The platform's own receiver
      # (/api/provider-webhooks/emulator) verifies HMACs against PROVIDER_WEBHOOK_SECRET, which the
      # acceptance suite signs with on the sending side.
    ports: ["8010:8010"]
    volumes:
      - provider_media:/data/provider-media
      - provider_state:/data/provider
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  payment-emulator:
    build: ./services/payment-emulator
    environment:
      SQLITE_PATH: /data/payment/payment.db
      # One source for the value the api verifies callbacks with. The emulator keeps an in-file
      # fallback because it is a local stand-in by definition, but under compose it is always told.
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set; see .env.example}
    ports: ["8020:8020"]
    volumes: ["payment_state:/data/payment"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./services/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://music_app:music_app@postgres:5432/music
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: music-assets
      PROVIDER_BASE_URL: http://provider-emulator:8010
      # No :-fallback here on purpose. The fallbacks that used to sit in this file are the same
      # literals as the ones in app/settings.py, and docker-compose.production.yml overrode none of
      # them -- so a production deploy that forgot a variable inherited a signing key published in a
      # public repository and never noticed. :? makes compose refuse to start instead, which is the
      # convention this file already uses for PUBLIC_ORIGIN and MINIO_ROOT_PASSWORD in the production
      # overlay. The local demo stack still works because .env (copied from .env.example) sets them.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set; see .env.example}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?MEDIA_SIGNING_SECRET must be set; see .env.example}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:?PROVIDER_WEBHOOK_SECRET must be set; see .env.example}
      PAYMENT_PROVIDER: emulator
      PAYMENT_BASE_URL: http://payment-emulator:8020
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set; see .env.example}
      # Pinned literal, deliberately not ${DEMO_STACK:-true}: an interpolation could be flipped by a
      # stray .env on the deploy host, and the value is the api's licence to run on repository demo
      # secrets. The production overlay sets it to "false" for the same reason it sets COOKIE_SECURE.
      DEMO_STACK: "true"
      # Pinned literal for the same reason DEMO_STACK is: this is the one peer whose X-Forwarded-For
      # the api may believe, and an interpolated value could be widened to "*" by a stray .env. The
      # gateway's address is fixed by the `networks:` block at the bottom of this file.
      FORWARDED_ALLOW_IPS: "172.28.95.250"
      ADDRESS_PEPPER: ${ADDRESS_PEPPER:?ADDRESS_PEPPER must be set; see .env.example}
      PUBLIC_API_BASE_URL: http://api:8000
      CORS_ORIGINS: http://localhost:4173,http://localhost:4174,http://localhost:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-14}
      PROVIDER_CONTRACT_VERSION: ${PROVIDER_CONTRACT_VERSION:-local-emulator-v1}
      MODERATION_POLICY_VERSION: ${MODERATION_POLICY_VERSION:-policy-v1}
    ports: ["8000:8000"]
    volumes: ["./shared/contracts:/app/contracts:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      provider-emulator: {condition: service_healthy}
      payment-emulator: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 4s
      timeout: 3s
      retries: 40

  worker:
    build: ./services/worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://music_worker:music_worker@postgres:5432/music
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: music-assets
      PROVIDER_BASE_URL: http://provider-emulator:8010
      MUSIC_PROVIDER: ${MUSIC_PROVIDER:-emulator}
      SUNO_API_BASE_URL: ${SUNO_API_BASE_URL:-}
      SUNO_MODEL: ${SUNO_MODEL:-chirp-v3-0}
      GENERIC_PROVIDER_BASE_URL: ${GENERIC_PROVIDER_BASE_URL:-}
      GENERIC_PROVIDER_API_KEY: ${GENERIC_PROVIDER_API_KEY:-}
      GENERIC_PROVIDER_MODEL: ${GENERIC_PROVIDER_MODEL:-}
      GENERIC_PROVIDER_SUBMIT_PATH: ${GENERIC_PROVIDER_SUBMIT_PATH:-/v1/jobs}
      GENERIC_PROVIDER_STATUS_PATH: ${GENERIC_PROVIDER_STATUS_PATH:-/v1/jobs/{job_id}}
      GENERIC_PROVIDER_CANCEL_PATH: ${GENERIC_PROVIDER_CANCEL_PATH:-/v1/jobs/{job_id}/cancel}
      LEASE_SECONDS: 30
      METRICS_PORT: 9101
      TRUSTED_INTERNAL_MEDIA_HOSTS: provider-emulator
      # 空 = 这台部署没有扫描引擎，资产记 unscanned（诚实缺省，见 020 的头注释）；
      # 配了就必须拿到判决才准落桶，引擎不可达时作业整条重试，绝不默认放行。
      MEDIA_SCAN_ENDPOINT: ${MEDIA_SCAN_ENDPOINT:-}
      MAX_MEDIA_BYTES: 52428800
    expose: ["9101"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      provider-emulator: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health')"]
      interval: 4s
      timeout: 3s
      retries: 40


  # 可选的扫描引擎：`docker compose --profile scan up -d` 并把 MEDIA_SCAN_ENDPOINT=clamav:3310 交给 worker。
  # 它不是缺省的一部分，理由是实测：本机 Docker VM 是 4 vCPU / 5.77 GiB（docker info 的
  # MemTotal=6198632448），而 ClamAV 官方文档（https://docs.clamav.net/ ，2026-09-27 打开）写的最低
  # 推荐内存就是 3 GiB+、磁盘 5 GiB 空闲；`docker pull clamav/clamav:1.4` 在这台 arm64 宿主上回答
  # `no matching manifest for linux/arm64/v8`，也就是只能靠平台模拟跑，冷启动还要 freshclam 联网取库。
  # 把一个 3 GiB 起的常驻体塞进还要跑整条 22 步认证链的 VM，代价由部署方按容量决定，不由这里默认。
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    profiles: ["scan"]
    expose: ["3310"]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s


  # Second live Worker for the lease contention drill (release gate G9-2). Defined here rather
  # than in an override file because `extends` only resolves within a single Compose document.
  # Inert until --profile contention is passed, so the default stack still runs one Worker.
  worker-b:
    extends: worker
    profiles: ["contention"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}

  web:
    build: ./services/web
    ports: ["4173:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 30

  admin:
    build: ./services/admin
    ports: ["4174:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 30

  gateway:
    build: ./services/gateway
    ports: ["${GATEWAY_PORT:-8080}:80"]
    networks:
      default:
        # The address the api trusts as "the proxy that told me who the client was". Static, because a
        # DHCP-assigned one would drift and the trust list would then silently stop matching -- which
        # is the failure this whole block exists to prevent, and it fails *quietly*: requests still
        # succeed, only the audit column and the source gate go back to seeing the container.
        ipv4_address: 172.28.95.250
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
      admin: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-health"]
      interval: 3s
      timeout: 3s
      retries: 30

  acceptance:
    profiles: ["test"]
    build: ./services/acceptance
    environment:
      API_BASE_URL: http://api:8000
      PROVIDER_BASE_URL: http://provider-emulator:8010
      PAYMENT_BASE_URL: http://payment-emulator:8020
      WEB_BASE_URL: http://web
      ADMIN_BASE_URL: http://admin
      WORKER_METRICS_BASE_URL: http://worker:9101
      # The suite signs a provider webhook, so it needs the same secret the api verifies with.
      # Until now it carried its own copy of the literal as an os.getenv fallback, which is why the
      # test passed while the two sides agreed by coincidence: changing the deployed value made the
      # container sign with a key the api no longer uses. :? keeps both sides reading one source.
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:?PROVIDER_WEBHOOK_SECRET must be set; see .env.example}
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
      web: {condition: service_healthy}
      admin: {condition: service_healthy}

networks:
  default:
    # Declared so the gateway can hold a fixed address and so the trust list can name one peer instead
    # of a range. If another project on the host already owns this /24, compose says so loudly at `up`
    # -- an overlap it refuses, not one it quietly reroutes around.
    #
    # Where the pin sits is not arbitrary. Measured on this host at acceptance-20260927T221550Z: the
    # gateway used to be pinned at .10, but the allocator hands out .2, .3, .4... in creation order and
    # the gateway starts LAST (it depends on api/web/admin), so `web` already held .10 and the gateway
    # came up as `failed to set up container networking: Address already in use` -- chain step 2 red.
    # `iprange` (the usual way to fence the pool out) is rejected by this compose version:
    # `networks.default.ipam.config.0 additional properties 'iprange' not allowed`, measured with
    # `docker compose config`. So the pin lives above anything the pool can reach: with roughly a dozen
    # containers per stack, dynamic allocation cannot arrive at the top of a /24, and a collision would
    # fail loudly at `up` rather than silently. tests/unit/test_login_source_gate.py pins the octet.
    ipam:
      config:
        - subnet: 172.28.95.0/24
          gateway: 172.28.95.1

volumes:
  pg_data:
  redis_data:
  minio_data:
  provider_media:
  provider_state:
  payment_state:
  prometheus_data:
